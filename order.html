 <script>
  const messages = [
  "📞 Appel client pour médicaments (Akanda –)",
    "💬 Click & Collect choisi (Owendo – Carrefour)",
    "📦 Livraison confirmée (Franceville )",
    "📦 Livraison confirmée (Libreville – Lalala)",
    "📦 Livraison confirmée (Owendo)",
    "📦 Livraison confirmée (Pharmacie Partenaire – Nzeng-Ayong)",
    "📦 Livraison confirmée (Port-Gentil)",
    "📦 Click & Collect validé (Sherco – Akanda)",
    "💬 Commande WhatsApp reçue (Libreville – Charbonnage)",
    "📞 Appel client pour médicaments (Akanda –)",
    "💬 Click & Collect choisi (Owendo – Carrefour)",
    "📦 Livraison confirmée (Franceville – )",
    "📦 Livraison confirmée (Libreville – Lalala)",
    "💬 Un utilisateur a contacté un pharmacien (Port-Gentil – Matanda)"
  ];

  let index = 0;
  function showMessage() {
    const chat = document.getElementById("liveChat");
    const msg = document.createElement("div");
    msg.className = "live-message";

    // avatar générique
    const avatar = document.createElement("img");
    avatar.src = "img/avatar.jpg"; // mets une petite image ronde
    avatar.className = "avatar";

    const text = document.createElement("span");
    text.textContent = messages[index % messages.length];

    msg.appendChild(avatar);
    msg.appendChild(text);
    chat.appendChild(msg);

    // Supprimer le message après 6 secondes
    setTimeout(() => {
      msg.remove();
    }, 6000);

    index++;
  }

  // Premier message
  showMessage();
  // Nouveau message toutes les 5 secondes
  setInterval(showMessage, 5000);
</script>
